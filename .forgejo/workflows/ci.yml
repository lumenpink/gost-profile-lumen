name: "CI / CD Pipeline"

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test:
    name: "Validate Specification & Site"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Verify Essential Files"
        run: |
          test -f profile.md || { echo "profile.md missing"; exit 1; }
          test -f GOSTVER || { echo "GOSTVER missing"; exit 1; }
          test -f README.md || { echo "README.md missing"; exit 1; }
          test -f LICENSE || { echo "LICENSE missing"; exit 1; }
          test -f VERSION || { echo "VERSION missing"; exit 1; }
          test -f site/index.html || { echo "site/index.html missing"; exit 1; }
          test -f site/profile.md || { echo "site/profile.md missing"; exit 1; }
          test -f site/card_preview.html || { echo "site/card_preview.html missing"; exit 1; }
          test -f site/assets/og_preview.png || { echo "site/assets/og_preview.png missing"; exit 1; }
          test -f site/_headers || { echo "site/_headers missing"; exit 1; }
          if command -v cccp >/dev/null 2>&1; then
            cccp check --strict
          fi
          echo "All essential Lumen profile files are present and valid."

  deploy-site:
    name: "Deploy Documentation Site"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: "Deploy to Cloudflare Workers"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx wrangler deploy
          else
            echo "CLOUDFLARE_API_TOKEN not set, skipping Cloudflare deploy."
          fi
